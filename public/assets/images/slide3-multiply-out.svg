<text x="500" y="46" text-anchor="middle" font-family="Nunito,sans-serif" font-size="22" font-weight="900" fill="#ffbe1a">Step 3 — Multiply Out Each Share</text>
<g transform="translate(250,150)">
<rect x="-130" y="-60" width="260" height="150" rx="14" fill="#0e0724" stroke="#4A90D9" stroke-width="5"/>
<text x="0" y="-28" text-anchor="middle" font-family="Nunito,sans-serif" font-size="18" font-weight="900" fill="#4A90D9">AISHA</text>
<text x="0" y="14" text-anchor="middle" font-family="monospace" font-size="26" font-weight="900" fill="#ffffff">4 × 5</text>
<text x="0" y="58" text-anchor="middle" font-family="monospace" font-size="38" font-weight="900" fill="#4A90D9">= 20</text>
<text x="0" y="82" text-anchor="middle" font-family="Nunito,sans-serif" font-size="14" font-weight="800" fill="#bca8f2">sweets</text>
</g>
<g transform="translate(730,150)">
<rect x="-130" y="-60" width="260" height="150" rx="14" fill="#0e0724" stroke="#FF8A50" stroke-width="5"/>
<text x="0" y="-28" text-anchor="middle" font-family="Nunito,sans-serif" font-size="18" font-weight="900" fill="#FF8A50">BEN</text>
<text x="0" y="14" text-anchor="middle" font-family="monospace" font-size="26" font-weight="900" fill="#ffffff">5 × 5</text>
<text x="0" y="58" text-anchor="middle" font-family="monospace" font-size="38" font-weight="900" fill="#FF8A50">= 25</text>
<text x="0" y="82" text-anchor="middle" font-family="Nunito,sans-serif" font-size="14" font-weight="800" fill="#bca8f2">sweets</text>
</g>
<text x="490" y="165" text-anchor="middle" font-size="40" font-weight="900" fill="#ffbe1a">+</text>
<rect x="270" y="286" width="460" height="34" rx="10" fill="rgba(255,190,26,0.12)" stroke="#ffbe1a" stroke-width="2"/>
<text x="500" y="309" text-anchor="middle" font-family="Nunito,sans-serif" font-size="15" font-weight="800" fill="#ffbe1a">Share = ratio number × value of one part</text>
<g transform="translate(60,200)">
