<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2e205e"/><stop offset="100%" stop-color="#1b103c"/></linearGradient></defs>
